name: Android CI/CD — Build & Release Signed APK

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      release_channel:
        description: "Build channel (release)"
        required: false
        default: "release"

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build Signed Release APK & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17 (Eclipse Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
          cache: "gradle"

      - name: Setup Android SDK & Build Tools
        uses: android-actions/setup-android@v4

      - name: Grant Execute Permission for Gradlew
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
          fi

      - name: Configure Valid Release Keystore
        id: signing_setup
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          KEYSTORE_FILE="${GITHUB_WORKSPACE}/my-upload-key.jks"
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "Using repository release signing secrets..."
            echo "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_FILE"
            echo "KEYSTORE_PATH=$KEYSTORE_FILE" >> "$GITHUB_ENV"
            echo "STORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
          else
            echo "Generating valid RSA-2048 release keystore (alias: upload)..."
            rm -f "$KEYSTORE_FILE"
            keytool -genkeypair -v \
              -keystore "$KEYSTORE_FILE" \
              -alias upload \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass "bmicalculator2026" \
              -keypass "bmicalculator2026" \
              -dname "CN=BMI Calculator Release, OU=Mobile Engineering, O=AI Studio, L=Mountain View, ST=CA, C=US"
            echo "KEYSTORE_PATH=$KEYSTORE_FILE" >> "$GITHUB_ENV"
            echo "STORE_PASSWORD=bmicalculator2026" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=bmicalculator2026" >> "$GITHUB_ENV"
          fi

      - name: Run Unit & Robolectric Verification Suite
        run: |
          if [ -f "./gradlew" ]; then
            ./gradlew :app:testDebugUnitTest --no-daemon
          else
            gradle :app:testDebugUnitTest --no-daemon
          fi

      - name: Assemble Signed Release APK
        id: assemble_apk
        run: |
          GRADLE_CMD="gradle"
          if [ -f "./gradlew" ]; then
            GRADLE_CMD="./gradlew"
          fi

          $GRADLE_CMD assembleRelease --no-daemon
          APK_FILE=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)

          if [ -z "$APK_FILE" ]; then
            echo "Error: Signed release APK was not found!"
            exit 1
          fi

          OUT_APK="${GITHUB_WORKSPACE}/BMI-Calculator-${{ github.ref_name }}-release-signed.apk"
          cp "$APK_FILE" "$OUT_APK"
          echo "apk_path=$OUT_APK" >> "$GITHUB_OUTPUT"

      - name: Verify APK Signature & Compute Checksums (SHA-256 & MD5)
        id: checksums
        run: |
          APKSIGNER_BIN=$(find $ANDROID_SDK_ROOT/build-tools -name "apksigner" | sort -V | tail -n 1)
          "$APKSIGNER_BIN" verify --verbose --print-certs "${{ steps.assemble_apk.outputs.apk_path }}"
          SHA256_SUM=$(sha256sum "${{ steps.assemble_apk.outputs.apk_path }}" | awk '{ print $1 }')
          MD5_SUM=$(md5sum "${{ steps.assemble_apk.outputs.apk_path }}" | awk '{ print $1 }')
          echo "sha256=${SHA256_SUM}" >> "$GITHUB_OUTPUT"
          echo "md5=${MD5_SUM}" >> "$GITHUB_OUTPUT"
          echo "Computed SHA-256: ${SHA256_SUM}"
          echo "Computed MD5: ${MD5_SUM}"

      - name: Upload Signed Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BMI-Calculator-Release-Signed-APK-${{ github.ref_name }}
          path: ${{ steps.assemble_apk.outputs.apk_path }}
          if-no-files-found: error

      - name: Publish Official GitHub Release on Version Tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: "BMI Calculator ${{ github.ref_name }} — Signed Release APK"
          body_path: RELEASE_NOTES.md
          draft: false
          prerelease: false
          files: |
            ${{ steps.assemble_apk.outputs.apk_path }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
