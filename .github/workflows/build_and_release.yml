name: Android CI/CD — Build & Release APK

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      release_channel:
        description: "Build channel (release or debug)"
        required: false
        default: "release"

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build Standalone APK & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17 (Eclipse Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
          cache: "gradle"

      - name: Setup Android SDK & Build Tools
        uses: android-actions/setup-android@v3

      - name: Grant Execute Permission for Gradlew
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
          fi

      - name: Configure Signing Keystore (Release or Debug Fallback)
        id: signing_setup
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "Release signing secrets detected. Decoding release keystore..."
            echo "$KEYSTORE_BASE64" | base64 --decode > "${GITHUB_WORKSPACE}/my-upload-key.jks"
            echo "KEYSTORE_PATH=${GITHUB_WORKSPACE}/my-upload-key.jks" >> "$GITHUB_ENV"
            echo "STORE_PASSWORD=${KEYSTORE_PASSWORD}" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=${KEY_PASSWORD}" >> "$GITHUB_ENV"
            echo "build_variant=release" >> "$GITHUB_OUTPUT"
          else
            echo "Release secrets not configured. Generating debug fallback keystore..."
            if [ ! -f "${GITHUB_WORKSPACE}/debug.keystore" ]; then
              keytool -genkeypair -v \
                -keystore "${GITHUB_WORKSPACE}/debug.keystore" \
                -storepass android \
                -alias androiddebugkey \
                -keypass android \
                -keyalg RSA \
                -keysize 2048 \
                -validity 10000 \
                -dname "CN=Android Debug,O=Android,C=US"
            fi
            echo "build_variant=debug" >> "$GITHUB_OUTPUT"
          fi

      - name: Run Unit & Robolectric Verification Suite
        run: |
          if [ -f "./gradlew" ]; then
            ./gradlew :app:testDebugUnitTest --no-daemon
          else
            gradle :app:testDebugUnitTest --no-daemon
          fi

      - name: Assemble Android APK
        id: assemble_apk
        run: |
          GRADLE_CMD="gradle"
          if [ -f "./gradlew" ]; then
            GRADLE_CMD="./gradlew"
          fi

          if [ "${{ steps.signing_setup.outputs.build_variant }}" == "release" ]; then
            $GRADLE_CMD assembleRelease --no-daemon
            APK_FILE=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          else
            $GRADLE_CMD assembleDebug --no-daemon
            APK_FILE=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          fi

          cp "$APK_FILE" "${GITHUB_WORKSPACE}/BMI-Calculator-${{ github.ref_name }}.apk"
          echo "apk_path=${GITHUB_WORKSPACE}/BMI-Calculator-${{ github.ref_name }}.apk" >> "$GITHUB_OUTPUT"

      - name: Compute APK Checksums (SHA-256 & MD5)
        id: checksums
        run: |
          SHA256_SUM=$(sha256sum "${{ steps.assemble_apk.outputs.apk_path }}" | awk '{ print $1 }')
          MD5_SUM=$(md5sum "${{ steps.assemble_apk.outputs.apk_path }}" | awk '{ print $1 }')
          echo "sha256=${SHA256_SUM}" >> "$GITHUB_OUTPUT"
          echo "md5=${MD5_SUM}" >> "$GITHUB_OUTPUT"
          echo "Computed SHA-256: ${SHA256_SUM}"
          echo "Computed MD5: ${MD5_SUM}"

      - name: Upload APK Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BMI-Calculator-APK-${{ github.ref_name }}
          path: ${{ steps.assemble_apk.outputs.apk_path }}
          if-no-files-found: error

      - name: Publish Official GitHub Release on Version Tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: "BMI Calculator ${{ github.ref_name }} — Material 3 Expressive Release"
          body_path: RELEASE_NOTES.md
          draft: false
          prerelease: false
          files: |
            ${{ steps.assemble_apk.outputs.apk_path }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
